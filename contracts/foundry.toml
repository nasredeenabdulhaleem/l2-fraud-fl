[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
gas_reports = ["FLAggregator"]

[fmt]
line_length = 100
tab_width = 4

# Named RPC endpoints. Fill values from .env at deploy time.
[rpc_endpoints]
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC}"
base_sepolia = "${BASE_SEPOLIA_RPC}"
